name: Lahore AQI Forecast Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Generate forecast if due
        run: python forecast_engine.py

      - name: Save forecast
        run: |
          git config user.name "Lahore Air Forecast Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git diff --cached --quiet || git commit -m "Update AQI forecast"
          git push
